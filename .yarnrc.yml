compressionLevel: mixed

enableTelemetry: false

nodeLinker: node-modules

npmPublishRegistry: "https://registry.npmjs.org"

npmRegistryServer: "https://registry.npmjs.org"

packageExtensions:
  "@radix-ui/react-tooltip@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  "@testing-library/react@*":
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  cmdk@*:
    peerDependenciesMeta:
      "@types/react":
        optional: true
      react:
        optional: true
      react-dom:
        optional: true
  react-big-calendar@*:
    peerDependenciesMeta:
      react:
        optional: true
      react-dom:
        optional: true
  ts-jest@*:
    peerDependenciesMeta:
      typescript:
        optional: true
